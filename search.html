<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search | LuminaVubon</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="container">

<div class="logo-bar">

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<h1>LuminaVubon🌐</h1>

</div>

<div class="header-tools">

<input
type="text"
id="searchBox"
class="search-input"
placeholder="Search anything...">

<button id="searchBtn" class="search-btn">

🔍

</button>

</div>

</div>

</header>

<section class="featured">

<div class="container">

<h2>🔍 Search Results</h2>

<div id="results" class="card-container">

</div>

</div>

</section><script>

const data = [

{
title:"📰 LuminaVubon News",
keywords:["news","world","headline","breaking"],
url:"news.html"
},

{
title:"💻 Technology",
keywords:["technology","tech","computer","software"],
url:"technology.html"
},

{
title:"🤖 AI Tools",
keywords:["ai","chatgpt","gemini","claude","copilot","ai tools"],
url:"ai-tools.html"
},

{
title:"❤️ Health",
keywords:["health","medical","fitness"],
url:"health.html"
},

{
title:"🍔 Food",
keywords:["food","recipe","nutrition"],
url:"food.html"
},

{
title:"🌿 Lifestyle",
keywords:["lifestyle","life","travel"],
url:"lifestyle.html"
},

{
title:"💰 Earning Tips",
keywords:["earning","earning tips","affiliate","freelancing","income"],
url:"earning-tips.html"
},

{
title:"🌍 BBC News",
keywords:["bbc","bbc news"],
url:"https://www.bbc.com/news"
},

{
title:"🌍 Reuters",
keywords:["reuters"],
url:"https://www.reuters.com/"
},

{
title:"🌍 CNN",
keywords:["cnn"],
url:"https://edition.cnn.com/"
},

{
title:"🤖 ChatGPT",
keywords:["chatgpt","openai"],
url:"https://chatgpt.com/"
},

{
title:"🤖 Google Gemini",
keywords:["gemini","google ai"],
url:"https://gemini.google.com/"
},

{
title:"🤖 Claude AI",
keywords:["claude"],
url:"https://claude.ai/"
},

{
title:"💼 Fiverr",
keywords:["fiverr"],
url:"https://www.fiverr.com/"
},

{
title:"💼 Upwork",
keywords:["upwork"],
url:"https://www.upwork.com/"
},

{
title:"📢 Adsterra",
keywords:["adsterra"],
url:"https://adsterra.com/"
},

{
title:"🤝 AdCombo",
keywords:["adcombo"],
url:"https://adcombo.com/"
},

{
title:"🛒 Amazon Associates",
keywords:["amazon","affiliate"],
url:"https://affiliate-program.amazon.com/"
},

{
title:"🤝 PartnerStack",
keywords:["partnerstack"],
url:"https://partnerstack.com/"
];const results = document.getElementById("results");

function searchSite(){

const keyword = document.getElementById("searchBox").value.toLowerCase().trim();

results.innerHTML="";

if(keyword===""){
results.innerHTML="<div class='card'><p>Type something to search...</p></div>";
return;
}

let found=false;

data.forEach(item=>{

if(item.keywords.some(k=>k.includes(keyword)||keyword.includes(k))){

found=true;

results.innerHTML+=`

<div class="card">

<h3>${item.title}</h3>

<a href="${item.url}" target="_blank" class="card-btn">

Open →

</a>

</div>

`;

}

});

if(!found){

results.innerHTML=`

<div class="card">

<h3>❌ No Result Found</h3>

<p>Try another keyword.</p>

</div>

`;

}

}

document.getElementById("searchBtn").addEventListener("click",searchSite);

document.getElementById("searchBox").addEventListener("keypress",function(e){

if(e.key==="Enter"){

searchSite();

}

});// Extra Resources

data.push(

{title:"🎨 Canva",keywords:["canva","design"],url:"https://www.canva.com/"},

{title:"💻 GitHub",keywords:["github","code"],url:"https://github.com/"},

{title:"📺 YouTube",keywords:["youtube","video"],url:"https://www.youtube.com/"},

{title:"💼 LinkedIn",keywords:["linkedin","jobs"],url:"https://www.linkedin.com/"},

{title:"📘 Facebook",keywords:["facebook","fb"],url:"https://www.facebook.com/"},

{title:"🐦 X (Twitter)",keywords:["twitter","x"],url:"https://x.com/"},

{title:"📷 Instagram",keywords:["instagram","ig"],url:"https://www.instagram.com/"},

{title:"💬 Reddit",keywords:["reddit"],url:"https://www.reddit.com/"},

{title:"📚 Stack Overflow",keywords:["stack overflow","stackoverflow"],url:"https://stackoverflow.com/"}

);

</script>

<script src="script.js"></script>

</body>

</html>
